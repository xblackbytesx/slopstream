name: Build signed release APK

# A stable version tag (v1.2.0; pre-releases like v1.2.0-rc1 are skipped) runs the tests,
# builds a signed release APK and attaches it to the Gitea release, where Obtainium picks it
# up. Also runnable by hand (a dispatch run may be unsigned and publishes nothing).
#
# Repo secrets (Settings > Actions > Secrets):
#   RELEASE_KEYSTORE_BASE64    base64 -w0 release.jks   (make keystore)
#   RELEASE_KEYSTORE_PASSWORD  store password
#   RELEASE_KEY_ALIAS          key alias
#   RELEASE_KEY_PASSWORD       key password

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    # No `container:`: JS actions need node, which the runner image has.
    runs-on: ubuntu-latest
    env:
      # Keep in lockstep with docker/Dockerfile. AGP also wants build-tools 36.
      CMDLINE_TOOLS_VERSION: "16111833"
      ANDROID_PLATFORM: android-37.0
      BUILD_TOOLS_VERSION: "37.0.0"
      AGP_BUILD_TOOLS_VERSION: "36.0.0"
      GRADLE_VERSION: "9.8.0"
      ANDROID_HOME: /opt/android-sdk
      SIGNING_ENABLED: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # A tag build without the key would publish an APK Obtainium cannot update to.
      - name: Signing secrets are set for tag builds
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNING_ENABLED != 'true'
        run: |
          echo "::error::RELEASE_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release"
          exit 1

      - name: Version from tag
        id: version
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            name="${ref#v}"
            # Monotonic and independent of run numbers: 1.2.3 -> 1002003.
            code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          else
            name="0.0.0-dev.${{ github.run_number }}"
            code=1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "version $name ($code)"

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk
            /opt/gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: slopstream-android-${{ hashFiles('gradle/libs.versions.toml', 'gradle/verification-metadata.xml', 'app/build.gradle.kts') }}
          restore-keys: slopstream-android-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK and Gradle
        run: |
          set -euo pipefail
          # act_runner images run as root without sudo; hosted ones have it.
          SUDO=$(command -v sudo || true)
          $SUDO mkdir -p /opt/android-sdk /opt/gradle && $SUDO chown -R "$(id -u)" /opt/android-sdk /opt/gradle
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -o /tmp/ct.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          # `yes` is killed by SIGPIPE when sdkmanager stops reading (exit 141), which
          # pipefail would count as a failure: here only sdkmanager's own status counts.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS_VERSION}" "build-tools;${AGP_BUILD_TOOLS_VERSION}" > /dev/null
          set -o pipefail
          if [ ! -d "/opt/gradle/gradle-${GRADLE_VERSION}" ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
          fi
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Tests
        run: gradle --no-daemon :core:test :source-youtube:test :source-floatplane:test :app:testDebugUnitTest

      - name: Materialize release keystore
        if: env.SIGNING_ENABLED == 'true'
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > /tmp/release.jks

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ env.SIGNING_ENABLED == 'true' && '/tmp/release.jks' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Remove keystore
        if: always()
        run: rm -f /tmp/release.jks

      # The certificate digest is what Obtainium (and Android) pin updates to; printed so it
      # can be checked against the key you generated.
      - name: Collect and verify the APK
        run: |
          set -euo pipefail
          mkdir -p dist
          out=app/build/outputs/apk/release
          if [ "$SIGNING_ENABLED" = "true" ]; then
            apk="dist/slopstream-${{ github.ref_name }}.apk"
            cp "$out/app-release.apk" "$apk"
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --print-certs "$apk" | grep -i "SHA-256"
          else
            cp "$out/app-release-unsigned.apk" "dist/slopstream-${{ github.ref_name }}-unsigned.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v3
        with:
          name: slopstream-apk
          path: dist/*

      - name: Attach the APK to the Gitea release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq > /dev/null || { SUDO=$(command -v sudo || true); $SUDO apt-get update -qq && $SUDO apt-get install -y -qq jq; }
          tag="${{ github.ref_name }}"
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          auth="Authorization: token $TOKEN"
          id=$(curl -fsS -H "$auth" "$api/releases/tags/$tag" | jq -r '.id // empty' || true)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\"}" "$api/releases" | jq -r '.id')
          fi
          for f in dist/*.apk; do
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" "$api/releases/$id/assets?name=$(basename "$f")" > /dev/null
            echo "attached $(basename "$f") to release $tag"
          done
